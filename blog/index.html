<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Ruikez</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="glitch-body">

    <div class="noise"></div>

    <nav class="navbar">
        <a href="/" class="logo">RUIKEZ</a>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/blog/" class="active">Blog</a>
            <a href="/about/">About</a>
            <a href="/contact/">Contact</a>
        </div>
    </nav>

    <main class="glitch-page">
        <p class="terminal-line">root@ruikez:~$ cat /blog/archive</p>

        <h1 class="glitch-title" data-text="404">404</h1>

        <p class="glitch-subtitle">ARCHIVE_CORRUPTED</p>

        <div class="glitch-box">
            <p>[FAIL] /blog could not be mounted</p>
            <p>[WARN] missing entries detected</p>
            <p>[ERROR] transmission aborted</p>
            <p>[INFO] return to safety recommended</p>
        </div>

        <a class="error-return" href="/">return /home/ruikez</a>
    </main>

    <footer>
        Ruikez © 2026
    </footer>

</body>
</html>
