<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Ruikez</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body class="error-page">

    <div class="noise"></div>
    <div class="error-scanlines"></div>

    <nav class="navbar">
        <a href="/" class="logo">RUIKEZ</a>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/blog/" class="active">Blog</a>
            <a href="/about/">About</a>
            <a href="/contact/">Contact</a>
        </div>
    </nav>

    <main class="error-shell">

        <div class="error-terminal">
            root@ruikez:~$ ./blog
        </div>

        <div class="glitch-wrapper">
            <h1 class="glitch-404" data-text="404">404</h1>
        </div>

        <p class="error-title">
            FATAL: ARCHIVE_NOT_FOUND
        </p>

        <div class="error-output">
            <p>[ERROR] Failed to mount /blog</p>
            <p>[ERROR] Archive returned status 404</p>
            <p>[WARN]&nbsp; Data integrity unknown</p>
            <p>[FAIL]&nbsp; Transmission terminated</p>
        </div>

        <p class="error-message">
            The requested archive does not exist.
        </p>

        <a href="/" class="error-return">
            &gt; return /home/ruikez
        </a>

    </main>

    <footer>
        Ruikez © 2026
    </footer>

</body>
</html>
