<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ruikez</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >
</head>


<body>

    <div class="noise"></div>



    <!-- ============================================================
         NAVBAR
         ============================================================ -->

    <nav class="navbar">

        <a
            href="/"
            class="logo"
        >
            RUIKEZ
        </a>


        <div class="nav-links">

            <a
                href="/"
                class="active"
            >
                Home
            </a>

            <a href="/blog/">
                Blog
            </a>

            <a href="/about/">
                About
            </a>

            <a href="/contact/">
                Contact
            </a>

        </div>

    </nav>



    <!-- ============================================================
         HOME
         ============================================================ -->

    <main class="hero hero-centered">

        <section class="hero-text">

            <p class="terminal-line">
                root@ruikez:~$ cd /home/ruikez && ls -la
            </p>


            <h1 class="terminal-heading">
                <span class="heading-prefix">~/</span>WELCOME
            </h1>


            <p class="subtitle typewriter">
                 Placeholder</p>


            <div class="buttons">

                <a href="/blog/">
                    Read Blog
                </a>


                <button
                    class="channel-open"
                    id="channel-open"
                    type="button"
                >
                    Channel
                </button>


                <a href="/about/">
                    About Me
                </a>

            </div>

        </section>



        <section class="home-image">

            <video
                autoplay
                muted
                loop
                playsinline
            >

                <source
                    src="/assets/ruikez-home.mp4"
                    type="video/mp4"
                >

            </video>

        </section>

    </main>



    <footer>
        Ruikez © 2026
    </footer>



    <!-- ============================================================
         CHANNEL
         ============================================================ -->

    <section
        class="channel-overlay"
        id="channel-overlay"
        aria-hidden="true"
    >

        <button
            class="channel-close"
            id="channel-close"
            type="button"
            aria-label="Close channel"
        >
            ×
        </button>



        <div class="channel-shell">


            <!-- ====================================================
                 CHANNEL HEADER
                 ==================================================== -->

            <header class="channel-header">

                <div class="channel-address">

                    <span class="channel-user">
                        root@ruikez
                    </span>

                    <span class="channel-location">
                        :~/channel
                    </span>

                </div>


                <div class="channel-state">
                    READ ONLY
                </div>

            </header>



            <!-- ====================================================
                 CHANNEL POSTS
                 ==================================================== -->

            <div
                class="channel-feed"
                id="channel-feed"
            >


                <!--
                    POSTS ARE CHRONOLOGICAL.

                    OLDEST = TOP
                    NEWEST = BOTTOM

                    EVERY NEW POST GOES UNDER THE PREVIOUS ONE.
                -->


                <article class="channel-post">

                    <time class="channel-time">
                        05 OCT 2026 · 03:28
                    </time>

                    <p class="channel-text">channel works</p>

                    <img
                        class="channel-media"
                        src="/assets/channel/thumbs-up.jpg"
                        alt=""
                        onclick="openChannelImage(this)"
                    >

                </article>


               
                <!-- ==================================================
                     NEWEST POST GOES DIRECTLY ABOVE THIS COMMENT
                     ================================================== -->


            </div>



            <!-- ====================================================
                 BOTTOM TERMINAL
                 ==================================================== -->

            <div class="channel-terminal">

                <span>
                    guest@ruikez:~$
                </span>

                <span class="channel-terminal-cursor">
                    _
                </span>

            </div>

        </div>

    </section>



    <!-- ============================================================
         FULLSCREEN IMAGE VIEWER
         ============================================================ -->

    <div
        class="channel-image-viewer"
        id="channel-image-viewer"
        onclick="closeChannelImage()"
    >

        <img
            id="channel-image-full"
            src=""
            alt=""
        >

    </div>



    <!-- ============================================================
         CHANNEL JAVASCRIPT
         ============================================================ -->

    <script>

        const channelOpen =
            document.getElementById("channel-open");

        const channelClose =
            document.getElementById("channel-close");

        const channelOverlay =
            document.getElementById("channel-overlay");

        const channelFeed =
            document.getElementById("channel-feed");

        const channelImageViewer =
            document.getElementById("channel-image-viewer");

        const channelImageFull =
            document.getElementById("channel-image-full");



        /* ==========================================================
           OPEN CHANNEL
           ========================================================== */

function openChannel() {

    document.body.classList.add(
        "channel-active"
    );

    channelOverlay.classList.add(
        "open"
    );

    channelOverlay.setAttribute(
        "aria-hidden",
        "false"
    );


    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            channelFeed.scrollTop =
                channelFeed.scrollHeight;

        });

    });

}



        /* ==========================================================
           CLOSE CHANNEL
           ========================================================== */

        function closeChannel() {

            /*
                If an image happens to be open, close it first.
            */

            closeChannelImage();


            channelOverlay.classList.remove(
                "open"
            );


            channelOverlay.setAttribute(
                "aria-hidden",
                "true"
            );


            document.body.classList.remove(
                "channel-active"
            );

        }



        /* ==========================================================
           CHANNEL BUTTON
           ========================================================== */

        channelOpen.addEventListener(
            "click",
            openChannel
        );



        /* ==========================================================
           CHANNEL CLOSE BUTTON
           ========================================================== */

        channelClose.addEventListener(
            "click",
            closeChannel
        );



        /* ==========================================================
           IMAGE VIEWER
           ========================================================== */

        function openChannelImage(image) {

            channelImageFull.src =
                image.src;


            channelImageViewer.classList.add(
                "open"
            );

        }



        function closeChannelImage() {

            channelImageViewer.classList.remove(
                "open"
            );


            channelImageFull.src =
                "";

        }



        /* ==========================================================
           ESCAPE KEY
           ========================================================== */

        document.addEventListener(
            "keydown",
            (event) => {

                if (event.key !== "Escape") {
                    return;
                }


                /*
                    Escape closes the image first.
                */

                if (
                    channelImageViewer.classList.contains("open")
                ) {

                    closeChannelImage();

                    return;

                }


                /*
                    Otherwise Escape closes the channel.
                */

                if (
                    channelOverlay.classList.contains("open")
                ) {

                    closeChannel();

                }

            }
        );

    </script>


</body>
</html>
