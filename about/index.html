<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>About Me | Ruikez</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>


<body>

    <div class="noise"></div>


    <nav class="navbar">

        <a
            href="/"
            class="logo"
        >
            RUIKEZ
        </a>


        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/blog/">
                Blog
            </a>

            <a
                href="/about/"
                class="active"
            >
                About
            </a>

            <a href="/contact/">
                Contact
            </a>

        </div>

    </nav>


    <main class="hero hero-centered">

        <section class="hero-text">

            <p class="terminal-line">
                root@ruikez:~$ neofetch
            </p>


            <div class="system-card">

                <div class="card-title">
                    RUIKEZ
                </div>


                <div class="card-line"></div>


                <div class="system-stats">


                    <div class="stat-row">
                        <span class="stat-label">Location:</span>
                        <span class="stat-value">Placeholder</span>
                    </div>


                    <div class="stat-row">
                        <span class="stat-label">Height:</span>
                        <span class="stat-value">183 cm</span>
                    </div>


                    <div class="stat-gap"></div>


                    <div class="stat-row">

                        <span class="stat-label">
                            Languages:
                        </span>

                        <span class="stat-value">
                            Native English<br>
                        </span>

                    </div>


                    <div class="stat-gap"></div>


                    <div class="stat-row">

                        <span class="stat-label">
                            Interests:
                        </span>

                        <span class="stat-value">
                            Placeholder<br>
                        </span>

                    </div>


                <div class="card-line bottom-line"></div>


            </div>

        </section>

    </main>


    <footer>
        Ruikez © 2026
    </footer>


</body>

</html>
